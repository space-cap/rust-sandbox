[package]
name = "desktop-04-tauri-basics"
version = "0.1.0"
edition = "2021"

[lib]
name = "desktop_04_tauri_basics"
path = "src/lib.rs"
test = false

[[bin]]
name = "desktop-04-tauri-basics"
path = "src/main.rs"

[dependencies]
tauri = { version = "2.2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.30"
tokio = { version = "1", features = ["sync", "time", "rt"] }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
