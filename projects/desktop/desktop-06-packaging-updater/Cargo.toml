[package]
name = "desktop-06-packaging-updater"
version = "1.0.0"
edition = "2021"

[lib]
name = "desktop_06_packaging_updater"
path = "src/lib.rs"
test = false

[[bin]]
name = "desktop-06-packaging-updater"
path = "src/main.rs"

[dependencies]
tauri = { version = "2.2", features = ["image-png", "image-ico"] }
tauri-plugin-updater = "2"
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["sync", "time", "rt"] }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

