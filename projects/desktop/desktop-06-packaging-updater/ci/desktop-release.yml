# ============================================================
# GitHub Actions: 전 플랫폼 크로스 컴파일 & 자동 릴리즈 파이프라인
# 태그 푸시(v1.0.0 등) 시 Windows/macOS/Linux 설치 파일 자동 빌드
# ============================================================
name: Release Desktop App

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: 체크아웃 소스코드
        uses: actions/checkout@v4

      - name: Rust 툴체인 설정
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 우분투 웹뷰 및 GUI 라이브러리 설치 (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Tauri 앱 패키징 및 릴리즈 업로드 (Tauri Action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'App Release ${{ github.ref_name }}'
          releaseBody: '자동 생성된 멀티플랫폼 릴리즈 설치 파일입니다.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

