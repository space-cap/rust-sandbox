[package]
name = "desktop-02-egui-dashboard"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31"
egui_plot = "0.31"
tokio = { version = "1.43", features = ["rt-multi-thread", "time", "sync", "macros"] }
sysinfo = "0.33"
rfd = "0.15"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]

