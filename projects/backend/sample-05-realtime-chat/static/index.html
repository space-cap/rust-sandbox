<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🦀 Rust 고성능 실시간 웹소켓 채팅</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .chat-card {
      width: 100%;
      max-width: 600px;
      height: 750px;
      background: #1e293b;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
      overflow: hidden;
    }
    .header {
      padding: 18px 24px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title-area h1 { font-size: 1.15rem; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      padding: 4px 10px;
      border-radius: 9999px;
      background: #334155;
      color: #94a3b8;
    }
    .status-badge.connected { background: #064e3b; color: #34d399; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
    .connected .status-dot { background: #10b981; }
    
    .connection-bar {
      padding: 12px 20px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 0.95rem;
      outline: none;
    }
    input[type="text"]:focus { border-color: #38bdf8; }
    button {
      padding: 10px 18px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #0369a1; }
    button.disconnect { background: #e11d48; }
    button.disconnect:hover { background: #be123c; }

    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.93rem;
      line-height: 1.45;
      word-break: break-word;
    }
    .msg.system {
      align-self: center;
      background: #334155;
      color: #cbd5e1;
      font-size: 0.82rem;
      padding: 4px 12px;
      border-radius: 9999px;
    }
    .msg.other {
      align-self: flex-start;
      background: #334155;
      color: #f8fafc;
      border-bottom-left-radius: 2px;
    }
    .msg.self {
      align-self: flex-end;
      background: #0284c7;
      color: white;
      border-bottom-right-radius: 2px;
    }
    .sender-name {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 2px;
      font-weight: 600;
    }
    .msg.self .sender-name { display: none; }
    .msg-time { font-size: 0.7rem; color: rgba(255, 255, 255, 0.6); margin-top: 4px; text-align: right; }

    .input-bar {
      padding: 14px 20px;
      background: #0f172a;
      border-top: 1px solid #334155;
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="chat-card">
    <div class="header">
      <div class="title-area">
        <h1>🦀 Rust Axum 실시간 웹소켓</h1>
      </div>
      <div id="statusBadge" class="status-badge">
        <span class="status-dot"></span>
        <span id="statusText">연결 끊김</span>
      </div>
    </div>

    <div class="connection-bar">
      <input type="text" id="usernameInput" placeholder="닉네임을 입력하세요 (예: 페리스)">
      <button id="connectBtn" onclick="toggleConnect()">채팅방 입장</button>
    </div>

    <div class="messages" id="messageBox">
      <div class="msg system">💬 닉네임을 입력하고 채팅방에 입장해 보세요!</div>
    </div>

    <div class="input-bar">
      <input type="text" id="chatInput" placeholder="메시지를 입력하세요 (Enter)" disabled onkeydown="handleKey(event)">
      <button id="sendBtn" onclick="sendMessage()" disabled>전송</button>
    </div>
  </div>

  <script>
    let ws = null;
    let myName = "";

    function toggleConnect() {
      if (ws) {
        ws.close();
        return;
      }

      const input = document.getElementById("usernameInput");
      myName = input.value.trim() || "러스테이시안";
      input.disabled = true;

      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${protocol}//${location.host}/ws?username=${encodeURIComponent(myName)}`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        updateStatus(true);
        document.getElementById("connectBtn").innerText = "나가기";
        document.getElementById("connectBtn").classList.add("disconnect");
        document.getElementById("chatInput").disabled = false;
        document.getElementById("sendBtn").disabled = false;
        document.getElementById("chatInput").focus();
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          appendMessage(data);
        } catch (e) {
          console.error("메시지 파싱 실패:", e);
        }
      };

      ws.onclose = () => {
        updateStatus(false);
        ws = null;
        document.getElementById("usernameInput").disabled = false;
        document.getElementById("connectBtn").innerText = "채팅방 입장";
        document.getElementById("connectBtn").classList.remove("disconnect");
        document.getElementById("chatInput").disabled = true;
        document.getElementById("sendBtn").disabled = true;
      };
    }

    function updateStatus(connected) {
      const badge = document.getElementById("statusBadge");
      const text = document.getElementById("statusText");
      if (connected) {
        badge.classList.add("connected");
        text.innerText = "실시간 연결됨";
      } else {
        badge.classList.remove("connected");
        text.innerText = "연결 끊김";
      }
    }

    function sendMessage() {
      const input = document.getElementById("chatInput");
      const text = input.value.trim();
      if (!text || !ws) return;

      ws.send(text);
      input.value = "";
      input.focus();
    }

    function handleKey(e) {
      if (e.key === "Enter") sendMessage();
    }

    function appendMessage(data) {
      const box = document.getElementById("messageBox");
      const div = document.createElement("div");

      if (data.msg_type === "system") {
        div.className = "msg system";
        div.innerText = data.content;
      } else {
        const isSelf = data.sender === myName;
        div.className = `msg ${isSelf ? 'self' : 'other'}`;
        div.innerHTML = `
          <div class="sender-name">${data.sender}</div>
          <div>${escapeHtml(data.content)}</div>
          <div class="msg-time">${data.timestamp}</div>
        `;
      }

      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
