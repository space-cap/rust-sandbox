[package]
name = "wasm-05-performance-canvas"
version = "0.1.0"
edition = "2021"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
gloo-render = "0.2"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "MouseEvent",
    "TouchEvent",
    "TouchList",
    "Touch",
    "Performance",
    "DomRect",
    "Event",
] }
console_error_panic_hook = "0.1"
