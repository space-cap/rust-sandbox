[package]
name = "wasm-01-dom-basics"
version = "0.1.0"
edition = "2021"

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlButtonElement",
    "Window",
    "Node",
    "Event",
    "MouseEvent",
    "InputEvent",
    "console",
] }
console_error_panic_hook = "0.1"
