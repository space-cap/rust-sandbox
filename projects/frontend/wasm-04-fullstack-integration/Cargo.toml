[package]
name = "wasm-04-fullstack-integration"
version = "0.1.0"
edition = "2021"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
gloo-net = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
web-sys = { version = "0.3", features = [
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "Event",
    "InputEvent",
    "Window",
    "Document",
] }
console_error_panic_hook = "0.1"

