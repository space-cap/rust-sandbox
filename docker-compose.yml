services:
  # Sample 02: 견고한 REST CRUD API 서버
  api-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PACKAGE_NAME: sample-02-rest-crud
    container_name: rust-crud-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Sample 05: 실시간 웹소켓 단체 채팅 서버
  chat-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PACKAGE_NAME: sample-05-realtime-chat
    container_name: rust-chat-server
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      - RUST_LOG=info
